services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neurorulegen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurorulegen}
      POSTGRES_DB: ${POSTGRES_DB:-neurorulegen}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
