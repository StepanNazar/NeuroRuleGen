{% macro password_fields(label='Password') %}
  <div class="mb-3">
    <label class="form-label" for="password">{{ label }} </label>
    <input
      class="form-control"
      id="password"
      name="password"
      type="password"
      autocomplete="new-password"
      required
      minlength="8"
      pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
      aria-describedby="password-help"
    />
  </div>
  <div class="mb-3">
    <label class="form-label" for="password-confirmation">Confirm password</label>
    <input
      class="form-control"
      id="password-confirmation"
      type="password"
      autocomplete="new-password"
      required
    />
  </div>
  <label class="form-label" for="password-strength">Password strength</label>
  <meter class="w-100" id="password-strength" min="0" max="5" value="0"></meter>
  <p class="form-text" id="password-help">
    Use at least 8 characters, with uppercase, lowercase, a number and a special character.
  </p>
{% endmacro %}
