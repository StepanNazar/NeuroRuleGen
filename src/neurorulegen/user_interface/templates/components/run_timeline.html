<div class="border-start border-2 ps-3 ps-md-4">
  {% for event in events %}
    <section class="card timeline-event mb-4" id="event-{{ event.id }}">
      <div class="card-body">
        <span class="badge text-bg-primary mb-2">{{ '%02d'|format(event.id) }} </span>
        <h2 class="h5">{{ event.title }}</h2>
        <p>{{ event.description }}</p>
        <pre class="p-3 border rounded bg-body-tertiary text-break overflow-auto">
{{ event.data }}</pre>
        <div class="d-flex flex-wrap gap-2 small">
          Branches from this checkpoint:
          {% for branch in event.branches %}
            <a
              href="/projects/{{ project.id }}/{{ 'generations' if generation else 'analyses' }}/{{ branch }}/log?original={{ run_id }}"
              >Run #{{ branch }}
            </a>
          {% else %}
            <span class="text-secondary">none yet</span>
          {% endfor %}
        </div>
        <form method="post" action="/projects/{{ project.id }}/runs/{{ run_id }}/fork" class="mt-3">
          <input type="hidden" name="event" value="{{ event.id }}" />
          <input type="hidden" name="generation" value="{{ 1 if generation else 0 }}" />
          <label class="form-label" for="instruction-{{ event.id }}"
            >New instruction for this branch</label
          ><textarea
            class="form-control mb-3"
            name="instruction"
            id="instruction-{{ event.id }}"
            rows="2"
            placeholder="Additional instruction"
          ></textarea
          ><button class="btn btn-secondary">Restart from here</button>
        </form>
      </div>
    </section>
  {% endfor %}
</div>
