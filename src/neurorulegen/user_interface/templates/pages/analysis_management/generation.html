{% extends 'layouts/project.html' %}
{% block page_content %}
  <form method="post">
    <div class="row g-4">
      <div class="col-lg-7">
        <section class="card h-100">
          <div class="card-body">
            <h2 class="h5">Problem description</h2>
            <label class="form-label" for="description">Description / comment</label
            ><textarea class="form-control" rows="12" id="description" name="description" required>
{{ description }}</textarea>
          </div>
        </section>
      </div>
      <div class="col-lg-5">
        <section class="card">
          <div class="card-body">
            <h2 class="h5">Generation parameters</h2>
            <label class="form-label" for="provider">Provider</label>
            <select class="form-select mb-3" name="provider" id="provider">
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic</option>
            </select>
            <label class="form-label" for="model">Model</label>
            <select class="form-select mb-3" name="model" id="model">
              <option value="gpt-5">gpt-5</option>
            </select>
            <label class="form-label" for="mode">Mode</label>
            <select class="form-select mb-3" id="mode" name="mode">
              <option>Simple</option>
              <option>Iterative</option>
              <option>Multi-agent</option>
            </select>
            <div id="iteration-field" hidden>
              <label class="form-label" for="iterations">Iteration count</label>
              <input
                class="form-control mb-3"
                id="iterations"
                name="iterations"
                type="number"
                min="1"
                max="20"
                value="3"
              />
            </div>
            <div class="d-flex flex-wrap align-items-center gap-2">
              <button class="btn btn-primary">Generate</button>
              <a class="btn btn-secondary" href="/projects/{{ project.id }}">Cancel</a>
            </div>
          </div>
        </section>
      </div>
    </div>
  </form>
{% endblock %}
{% block page_scripts %}{{ vite_assets('js/forms.js') }}{% endblock %}
