{% extends 'layouts/auth.html' %}
{% block auth_content %}
  <form method="post">
    <label class="form-label" for="email">Email</label>
    <input
      class="form-control mb-3"
      id="email"
      name="email"
      type="email"
      autocomplete="username"
      required
    />
    <label class="form-label" for="password">Password</label>
    <input
      class="form-control mb-3"
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
    />
    <div class="border rounded bg-body-tertiary p-3 text-body-secondary mb-3">
      CAPTCHA verification
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary">Sign in</button>
      <a class="btn btn-secondary" href="/github/connect">Sign in with GitHub</a>
    </div>
  </form>
  <hr />
  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-secondary" href="/register">Register</a>
    <a class="btn btn-secondary" href="/password-recovery">Forgot password?</a>
  </div>
{% endblock %}
