{% extends 'layouts/auth.html' %}
{% from 'components/password_fields.html' import password_fields %}
{% block auth_content %}
  <form method="post" id="recovery-form">
    <label class="form-label" for="email">Email</label>
    <input
      class="form-control mb-3"
      id="email"
      name="email"
      type="email"
      autocomplete="email"
      required
    />
    <button class="btn btn-secondary" type="button" id="request-code" style="transition: transform 0.1s ease;"
  onpointerdown="this.style.transform='scale(0.95)'"
  onpointerup="this.style.transform='scale(1)'"
  onpointerleave="this.style.transform='scale(1)'">Get confirmation code</button>
    <hr />
    <label class="form-label" for="code">Email confirmation code</label>
    <input
      class="form-control mb-3"
      id="code"
      name="code"
      autocomplete="one-time-code"
      required
    />{{ password_fields('New password') }}
    <div class="d-flex flex-wrap align-items-center gap-2">
      <button class="btn btn-primary">Save password</button>
      <a class="btn btn-secondary" href="/login">Back to sign in</a>
    </div>
  </form>
{% endblock %}
{% block page_scripts %}{{ vite_assets('js/password_recovery.js') }}{% endblock %}
