{% extends 'layouts/auth.html' %}
{% block auth_content %}
  <p>1. Add this account to your authenticator app.</p>
  {% if qr_code_svg %}
    <div class="mb-3 text-center">
      <img src="{{ qr_code_svg }}" alt="TOTP QR Code" style="width: 200px; height: 200px; image-rendering: pixelated;" />
    </div>
  {% else %}
    <div
      class="border rounded bg-body-tertiary p-5 mx-auto text-center mb-3"
      role="img"
      aria-label="QR code placeholder"
    >
      QR code
    </div>
  {% endif %}
  <p>2. Enter the one-time code.</p>
  <form method="post" action="/totp/setup">
    <label class="form-label" for="code">TOTP code</label>
    <input
      class="form-control mb-4"
      id="code"
      name="code"
      pattern="[0-9]{6}"
      inputmode="numeric"
      autocomplete="one-time-code"
      required
    />
    <div class="d-flex flex-wrap align-items-center gap-2">
      <button class="btn btn-primary" type="submit">Confirm and enable</button>
      <a class="btn btn-secondary" href="/profile">Cancel</a>
    </div>
  </form>
{% endblock %}
