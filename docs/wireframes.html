<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroRuleGen —  wireframes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #252525; background: #f3f3f3; font: 14px/1.5 system-ui, sans-serif; }
    .viewer { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100dvh; }
    .screen-nav { overflow-y: auto; padding: 20px 12px; background: #e1e1e1; border-right: 1px solid #aaa; }
    .screen-nav h1 { font-size: 17px; margin: 0 6px 4px; }
    .screen-nav p { margin: 0 6px 18px; font-size: 12px; color: #555; }
    .group-name { margin: 18px 6px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .screen-tab { display: block; width: 100%; padding: 10px; margin: 3px 0; text-align: left; border: 1px solid transparent; color: #333; background: transparent; font: inherit; cursor: pointer; }
    .screen-tab[aria-selected="true"] { background: #fff; border-color: #777; font-weight: 650; }
    .screen-tab:focus-visible { outline: 3px solid #555; outline-offset: -3px; }
    .main { min-width: 0; overflow-y: auto; padding: 24px; }
    .viewer-note { margin: 0 0 16px; color: #555; font-size: 12px; }
    .screen-panel[hidden] { display: none; }
    .screen-description { margin-bottom: 20px; }
    .screen-description h2 { font-size: 23px; margin: 0 0 6px; }
    .screen-description p { margin: 0; color: #555; }
    .frame { background: #fff; border: 1px solid #aaa; max-width: 1240px; min-height: 680px; margin: auto; }
    .app-header, .project-nav, .footer { padding: 16px 24px; background: #e7e7e7; border-bottom: 1px solid #bbb; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    .brand { font-weight: 750; margin-right: auto; }
    .header-links { display: flex; gap: 16px; flex-wrap: wrap; }
    .burger { display: none; padding: 5px 10px; border: 1px solid #888; background: #ccc; font-size: 20px; line-height: 1; }
    .mobile-menu-note { display: none; color: #666; font-size: 11px; }
    .project-nav { background: #f0f0f0; padding-block: 12px; font-size: 12px; }
    .footer { border-bottom: 0; border-top: 1px solid #bbb; margin-top: 32px; color: #666; font-size: 12px; }
    .content { padding: 24px; }
    .breadcrumb { color: #666; font-size: 12px; margin-bottom: 16px; overflow-wrap: anywhere; }
    .page-heading { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; align-items: flex-start; }
    .page-heading h3 { margin: 0; font-size: 24px; }
    .page-heading p { color: #666; margin: 4px 0 0; }
    .stack { display: grid; gap: 16px; min-width: 0; }
    .columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .box { background: #eee; border: 1px solid #bbb; padding: 18px; min-width: 0; overflow-wrap: anywhere; }
    .box h4 { font-size: 16px; margin: 0 0 12px; }
    .box p { margin: 8px 0; }
    .box .box { background: #e0e0e0; }
    .placeholder { background: #ddd; border: 1px solid #aaa; padding: 12px; color: #444; min-height: 45px; overflow-wrap: anywhere; }
    .text-placeholder { min-height: 130px; }
    .code { font-family: ui-monospace, monospace; white-space: pre; overflow-x: auto; overflow-wrap: normal; min-width: 0; font-size: 12px; min-height: 170px; background: #ddd; padding: 14px; border: 1px solid #aaa; margin: 0; }
    .field { margin: 0 0 16px; }
    .field-label { display: block; font-size: 12px; font-weight: 650; margin-bottom: 5px; }
    .help { font-size: 12px; color: #666; margin-top: 6px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .action { display: inline-block; padding: 9px 14px; background: #ccc; border: 1px solid #888; font-size: 12px; overflow-wrap: anywhere; }
    .action.primary { color: #fff; background: #555; }
    .badge { display: inline-block; background: #d1d1d1; padding: 3px 8px; border: 1px solid #aaa; font: 11px system-ui, sans-serif; }
    .conditional { border: 1px dashed #777; padding: 12px; margin-top: 12px; background: #f6f6f6; }
    .condition-label { display: block; color: #555; font: 11px ui-monospace, monospace; margin-bottom: 8px; overflow-wrap: anywhere; }
    .notice { border: 1px solid #999; background: #dedede; padding: 14px; margin-bottom: 18px; overflow-wrap: anywhere; }
    .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, .4fr); gap: 12px; margin-bottom: 16px; }
    .list { display: grid; gap: 10px; }
    .list-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, .3fr) auto; gap: 14px; align-items: center; background: #e9e9e9; border: 1px solid #bbb; padding: 14px; min-width: 0; }
    .list-row small { display: block; color: #666; margin-top: 4px; overflow-wrap: anywhere; }
    .pagination { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 15px; font-size: 12px; }
    .pagination span { padding: 7px 10px; border: 1px solid #aaa; background: #e5e5e5; }
    .auth { max-width: 460px; margin: 32px auto; }
    .auth .box { padding: 24px; }
    .auth h3 { margin: 0 0 20px; font-size: 23px; }
    .meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .meta p { margin: 0; }
    .timeline { border-left: 2px solid #999; padding-left: 18px; display: grid; gap: 20px; }
    .event { position: relative; }
    .event::before { content: ''; position: absolute; left: -25px; top: 18px; width: 12px; height: 12px; background: #777; border: 2px solid #fff; }
    .branches { margin: 12px 0; padding: 10px; background: #d7d7d7; font-size: 12px; }
    .diff-file { border: 1px solid #aaa; min-width: 0; }
    .diff-heading { background: #ccc; padding: 12px; font: 12px ui-monospace, monospace; overflow-wrap: anywhere; }
    .diff-file .code { border: 0; min-height: auto; }
    .finding { padding: 16px; background: #eee; border-top: 1px solid #aaa; border-bottom: 1px solid #aaa; }
    .finding p { margin: 0 0 12px; }
    .qr { width: 160px; height: 160px; display: grid; place-items: center; background: #ccc; border: 1px solid #999; margin: 12px auto; text-align: center; }
    .separator { border: 0; border-top: 1px solid #bbb; margin: 20px 0; }
    .popup-preview { position: relative; padding: 40px 20px; background: #bbb; border: 1px solid #888; }
    .popup-caption { font-size: 11px; margin-bottom: 12px; color: #444; }
    .popup-card { max-width: 560px; margin: auto; padding: 20px; background: #eee; border: 1px solid #777; }
    .popup-card h4 { margin-top: 0; }
    .split-diff { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .split-diff > div { min-width: 0; }
    .split-diff > div + div { border-left: 1px solid #aaa; }
    .diff-label { padding: 8px 14px; background: #e5e5e5; font-size: 11px; border-bottom: 1px solid #aaa; }
    .unified-diff { display: none; }
    .flash-preview { padding: 8px 12px; background: #ddd; border: 1px solid #aaa; font-size: 12px; margin-bottom: 18px; }
    @media (max-width: 1100px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .columns { grid-template-columns: 1fr; } }
    @media (max-width: 760px) {
      .viewer { grid-template-columns: 104px minmax(0, 1fr); }
      .screen-nav { padding: 12px 5px; }
      .screen-nav h1 { font-size: 12px; margin-inline: 3px; }
      .screen-nav p { font-size: 10px; margin-inline: 3px; }
      .screen-tab { font-size: 11px; padding: 9px 5px; overflow-wrap: anywhere; }
      .group-name { font-size: 9px; margin-inline: 3px; }
      .main { padding: 10px; }
      .screen-description h2 { font-size: 18px; }
      .screen-description p, .viewer-note { font-size: 11px; }
      .frame { min-height: 600px; }
      .content { padding: 14px; }
      .app-header, .project-nav, .footer { padding: 12px; gap: 8px; font-size: 11px; }
      .brand { width: auto; min-width: 0; }
      .header-links, .project-nav { display: none; }
      .burger { display: inline-block; }
      .mobile-menu-note { display: block; width: 100%; }
      .split-diff { display: none; }
      .unified-diff { display: block; }
      .popup-preview { padding: 20px 8px; }
      .popup-card { padding: 12px; }
      .page-heading h3 { font-size: 20px; }
      .cards, .columns, .meta, .toolbar, .list-row { grid-template-columns: 1fr; }
      .box { padding: 12px; }
      .auth { margin: 16px 0; }
      .auth .box { padding: 14px; }
      .actions { align-items: stretch; }
      .action { flex: 1 1 auto; text-align: center; padding: 9px; }
      .page-heading > .actions { width: 100%; }
      .qr { width: 130px; height: 130px; }
      .timeline { padding-left: 12px; }
      .event::before { left: -19px; }
    }
  </style>
</head>
<body>
<div class="viewer">
  <aside class="screen-nav" aria-label="Wireframe screens">
    <h1>NeuroRuleGen</h1>
    <div id="tabs" role="tablist" aria-label="Choose a screen" aria-orientation="vertical"></div>
  </aside>
  <main class="main" id="main">
    <p class="viewer-note">Static grayscale wireframes. Only the left tabs work. Dashed outlines indicate conditional Jinja blocks. Popup previews show separate static states. Resize the window to preview mobile layouts.</p>
    <div id="panels"></div>
  </main>
</div>
<script>
  // No API or application behavior. Only the left screen tabs are interactive.
  const box = (title, body) => '<section class="box"><h4>' + title + '</h4>' + body + '</section>';
  const field = (label, text = 'Value / placeholder', type = '') => '<div class="field"><span class="field-label">' + label + '</span><div class="placeholder ' + type + '">' + text + '</div></div>';
  const code = (label, text) => '<div class="field"><span class="field-label">' + label + '</span><pre class="code">' + text + '</pre></div>';
  const actions = (...labels) => '<div class="actions">' + labels.map((label, i) => '<span class="action ' + (i === 0 ? 'primary' : '') + '">' + label + '</span>').join('') + '</div>';
  const conditional = (name, body) => '<div class="conditional"><span class="condition-label">{% if ' + name + ' %}</span>' + body + '</div>';
  const notice = text => '<div class="notice">' + text + '</div>';
  const badge = text => '<span class="badge">' + text + '</span>';
  const pagination = () => '<div class="pagination"><span>Previous</span><span>1</span><span>2</span><span>3</span><span>Next</span></div>';
  const list = (rows, paged = false) => '<div class="list">' + rows.map(([title, meta, status, action]) => '<div class="list-row"><div><strong>' + title + '</strong>' + (meta ? '<small>' + meta + '</small>' : '') + '</div><div>' + badge(status) + '</div>' + actions(...(Array.isArray(action) ? action : [action])) + '</div>').join('') + '</div>' + (paged ? pagination() : '');
  const heading = (title, subtitle = '', ...buttons) => '<div class="page-heading"><div><h3>' + title + '</h3>' + (subtitle ? '<p>' + subtitle + '</p>' : '') + '</div>' + (buttons.length ? actions(...buttons) : '') + '</div>';
  const popup = (title, body) => '<div class="popup-preview"><div class="popup-caption">Separate popup state preview — static, not an inline page section</div><div class="popup-card"><h4>' + title + '</h4>' + body + '</div></div>';
  const shell = (body, project = false, auth = false, admin = false) => {
    const links = admin ? '<span>Sign out</span>' : auth ? '' : '<span>Home: my projects</span><span>My profile</span>';
    return '<div class="frame"><header class="app-header"><span class="brand">NeuroRuleGen</span><div class="header-links">' + links + '</div><span class="burger" aria-label="Mobile menu placeholder">☰</span><span class="mobile-menu-note">Mobile menu · static placeholder' + (project ? ' · project navigation inside menu' : '') + '</span></header>' + (project ? '<div class="project-nav"><strong>Project: Demo Python API</strong><span>Overview</span><span>Rules</span><span>[is_quality_security_engineer: Settings]</span><span>[is_quality_security_engineer: AI]</span><span>[is_quality_security_engineer: Tokens]</span></div>' : '') + '<div class="content">' + (project ? '<div class="breadcrumb">Home: my projects / Demo Python API / Current page</div>' : '') + body + '</div><footer class="footer">NeuroRuleGen' + (admin ? '' : auth ? ' · Sign in / Register' : ' · Profile / Projects') + '</footer></div>';
  };
  const auth = (title, body) => shell('<div class="auth">' + box(title, body) + '</div>', false, true);
  const runMetadata = generation => box('Run parameters and token usage', '<div class="meta"><p>Status: ' + badge('Completed / Running / Failed') + '</p><p>Provider / model: configured-provider / model</p><p>Author: developer@example.com</p><p>Input / output / total tokens: 4200 / 1800 / 6000</p><p>Run #104 · ' + (generation ? 'Rule generation' : 'PR #42') + '</p></div><hr class="separator">' + (generation ? field('Initial instruction', 'Detect unsafe subprocess calls', 'text-placeholder') + field('Mode / iteration limit', 'Iterative / 3') : field('System prompt snapshot', 'Review Python code quality and security', 'text-placeholder') + field('Base / head commit SHA', '7ac1… / b2f8…') + field('MCP / Agent Skills snapshot', 'repository-files, python-quality')));
  const timeline = generation => '<div class="timeline">' + [
    ['01 · Tool call', generation ? 'Check the rule against test cases' : 'Read src/service.py', 'tool-call: inspect_python\narguments: { path: "src/service.py" }\nresult: sample file contents'],
    ['02 · Thoughts / intermediate conclusion', 'Display only when provided by the model provider', 'A potentially unsafe construct was found.\nNext step: inspect its context.'],
    ['03 · Final artifact', generation ? 'Rule code · open the created Draft' : 'Findings · open the PR analysis result', generation ? 'def analyze(tree):\n    # Sample rule code\n    return []' : 'Finding: src/service.py, lines 12–14\nDescription: review shell=True usage.']
  ].map(([title, description, text], i) => '<div class="event">' + box(title, '<p>' + description + '</p>' + code('Event data', text) + '<div class="branches">' + (i === 0 ? 'Branches from this checkpoint: run #105 · run #108' : 'Branches from this checkpoint: none yet') + '</div>' + field('New instruction for this branch', 'Additional instruction', 'text-placeholder') + actions('Restart from here')) + '</div>').join('') + '</div>';
  const diffFile = (path, before, after, unified, finding = '') => '<div class="diff-file"><div class="diff-heading">' + path + '</div><div class="split-diff"><div><div class="diff-label">Before</div><pre class="code">' + before + '</pre></div><div><div class="diff-label">After</div><pre class="code">' + after + '</pre></div></div><div class="unified-diff"><div class="diff-label">Unified · line by line</div><pre class="code">' + unified + '</pre></div>' + (finding ? '<div class="finding"><p><strong>Finding · ' + path + ':12</strong></p><p>' + finding + '</p>' + actions('Generate a rule for this finding') + '</div>' : '') + '</div>';
  const screens = [
    {id:'login', group:'Account', title:'01 · Sign in', note:'Local or GitHub sign-in. TOTP if required. Administrators go directly to the administration page.', html:auth('Sign in', '<div class="flash-preview">Redirect notification: password updated / sign-in verification result</div>' + field('Email', 'user@example.com') + field('Password', '••••••••') + field('CAPTCHA', 'Verification placeholder') + actions('Sign in', 'Sign in with GitHub') + '<hr class="separator">' + actions('Register', 'Forgot password?'))},
    {id:'register', group:'Account', title:'02 · Register', note:'Registration leads to the profile with an activation notice.', html:auth('Register', field('Display name') + field('Email', 'user@example.com') + field('Password', '••••••••') + field('Confirm password', '••••••••') + field('Password strength', 'Strength indicator · 8+ characters, uppercase, lowercase, digit, special character') + field('CAPTCHA', 'Verification placeholder') + actions('Create account', 'With GitHub', 'Back to sign in'))},
    {id:'admin', group:'Account', title:'03 · Administration', note:'Full paginated lists. Exact email filter; minimum failed attempts defaults to 0. Details open in a popup. No profile or project navigation.', html:shell(heading('Account security', 'Failed sign-in attempts over the last 7 days') + '<div class="stack">' + box('Failed sign-in attempts · all accounts', '<div class="toolbar">' + field('Exact email filter', 'Empty = all accounts; otherwise match the full email') + field('Minimum failed attempts', '0') + '</div>' + actions('Apply filters', 'Reset filters') + '<hr class="separator">' + list([
      ['user@example.com', '12 failed attempts', 'Not blocked', ['Details', 'Block']],
      ['blocked@example.com', '8 failed attempts', 'Blocked', ['Details', 'Unblock']],
      ['another@example.com', '3 failed attempts', 'Not blocked', ['Details', 'Block']]
    ], true)) + box('Currently blocked accounts', list([['blocked@example.com', '', 'Blocked', 'Unblock'], ['other@example.com', '', 'Blocked', 'Unblock']], true)) + popup('Failed sign-in details · user@example.com', '<p>12 failed attempts over the last 7 days</p>' + code('Date / IP address / full User-Agent', '2026-10-19 10:42 · 203.0.113.4\nMozilla/5.0 ... Firefox/...\n\n2026-10-19 10:45 · 203.0.113.8\ncurl/...') + actions('Close')) + '</div>', false, false, true)},
    {id:'profile', group:'Account', title:'04 · My profile', note:'Inactive users are redirected here. Conditional states are shown together only for review.', html:shell(heading('My profile', 'user@example.com') + conditional('not is_activated', notice('Your account is not activated. Activate it to access projects.') + actions('Resend activation email')) + '<div class="columns">' + box('Account details', field('Activation', 'Activated / awaiting activation') + field('GitHub', 'Connected: github-user / not connected') + field('Password', 'Set / not set') + field('TOTP 2FA', 'Enabled / disabled')) + box('Edit profile', field('Display name', 'Demo User') + actions('Save name') + conditional('not has_github', actions('Connect GitHub')) + conditional('has_github', '<p>GitHub: github-user</p>') + conditional('not has_password', field('Set password', 'New password + confirmation') + actions('Set password')) + conditional('has_password', field('Change password', 'Current / new / confirmation') + actions('Change password')) + conditional('not has_2fa', actions('Set up TOTP')) + conditional('has_2fa', actions('Disable 2FA'))) + '</div><hr class="separator">' + actions('Home: my projects · if activated', 'Sign out'))},
    {id:'activation', group:'Account', title:'05 · Activation', note:'Alternative success and error states. The final UI displays only one.', html:auth('Account activation', '<div class="stack">' + box('Success state', '<p>Your account has been activated.</p>' + actions('Go to home')) + box('Error state', '<p>The activation link is invalid or has expired.</p>' + actions('Go to profile · resend email')) + '</div>')},
    {id:'recovery', group:'Account', title:'06 · Password recovery', note:'One form: request an email code with REST, enter the code and new password. Saving redirects to sign-in, where a small notification displays the result.', html:auth('Recover password', field('Email', 'user@example.com') + actions('Get confirmation code') + '<hr class="separator">' + field('Email confirmation code', '123456') + field('New password', '••••••••') + field('Confirm new password', '••••••••') + field('Password strength', 'Strength indicator · 8+ characters, uppercase, lowercase, digit, special character') + actions('Save password', 'Back to sign in'))},
    {id:'totp-setup', group:'Account', title:'07 · Set up TOTP', note:'QR and secret are static placeholders. Confirmation returns to the profile.', html:auth('Set up two-factor authentication', '<p>1. Add this account to your authenticator app.</p><div class="qr">QR code<br>placeholder</div>' + field('Secret for manual entry', 'XXXX XXXX XXXX XXXX') + '<p>2. Enter the one-time code.</p>' + field('TOTP code', '123456') + actions('Confirm and enable', 'Cancel · profile'))},
    {id:'totp-login', group:'Account', title:'08 · Confirm TOTP', note:'Submit and redirect. The verification result appears on the destination page.', html:auth('Verify your sign-in', '<p>Enter the code from your authenticator app.</p>' + field('One-time code', '123456') + actions('Continue', 'Back to sign in'))},
    {id:'projects', group:'Projects', title:'09 · Home: my projects', note:'Project cards show only the project name, repository and open action. No filters or search.', html:shell(heading('Home: my projects', '', 'Create project') + '<div class="cards">' + box('Demo Python API', '<p>github-user/python-api</p>' + actions('Open project')) + box('Data tools', '<p>team/data-tools</p>' + actions('Open project')) + box('Backend service', '<p>team/backend-service</p>' + actions('Open project')) + '</div>' + conditional('projects is empty', notice('No projects yet. Create a project or wait for an invitation.')))},
    {id:'project-create', group:'Projects', title:'10 · Create project', note:'Enter a project name and a GitHub repository URL.', html:shell(heading('Create project') + box('Project details', field('Project name', 'Demo Python API') + field('GitHub repository URL', 'https://github.com/github-user/python-api') + actions('Create project', 'Cancel · home')))},
    {id:'project-settings', group:'Projects', title:'11 · Project settings', note:'Visible if is_quality_security_engineer. Repository details are separate from the rename form. Removing a developer opens a confirmation popup.', html:shell(heading('Project settings') + '<div class="stack">' + box('Connected repository · read-only', '<p>https://github.com/github-user/python-api</p>') + box('Update project name', field('Project name', 'Demo Python API') + actions('Save name')) + box('Developers and invitations', field('Developer email', 'developer@example.com') + actions('Add / invite') + '<hr class="separator">' + list([['developer@example.com', '', 'Developer', 'Remove'], ['future@example.com', '', 'Invitation pending', 'Remove']])) + popup('Remove developer?', '<p>Remove developer@example.com from this project?</p>' + actions('Remove developer', 'Cancel')) + '</div>', true)},
    {id:'dashboard', group:'Projects', title:'12 · Project overview', note:'Run rule-based analysis starts a run directly and opens its result. Each list has its own pagination. Rows contain a title, status and actions only. Leaving the project opens a confirmation popup.', html:shell(heading('Demo Python API', 'github-user/python-api', 'New AI analysis', 'Run rule-based analysis') + '<div class="stack">' + box('Recent AI PR analyses', list([['PR #42 · Validate input', '', 'Completed', ['Result', 'Log']], ['PR #41 · Refactor service', '', 'Running', ['Result', 'Log']], ['PR #40 · Fix cache', '', 'Failed', ['Result', 'Log']]], true)) + box('Recent rule-based analyses', list([['Analysis #84', '', 'Completed', 'Output'], ['Analysis #85', '', 'Running', 'Output']], true)) + box('Recent rule generations', list([['Generation #104 · shell=True', '', 'Completed', 'Generation log'], ['Generation #105 · subprocess', '', 'Failed', 'Generation log']], true)) + conditional('can_leave_project', actions('Leave project') + popup('Leave this project?', '<p>You will lose access to Demo Python API.</p>' + actions('Leave project', 'Cancel'))) + '</div>', true)},
    {id:'analysis-result', group:'Analyses', title:'13 · AI PR analysis result', note:'Wide screens: side-by-side diff. Narrow screens: unified line-by-line diff. Findings appear below the relevant changed lines.', html:shell(heading('PR #42 · Validate input', 'Analysis #104 · configured-provider / model', 'Analysis log', 'Analyze this PR again') + notice('Status: Completed / Running / Failed. On failure, keep partial results visible.') + '<div class="stack">' + diffFile('src/service.py', '10 def run_task(command):\n11     subprocess.run(command)', '10 def run_task(command):\n12     subprocess.run(command, shell=True)', ' 10 def run_task(command):\n-11     subprocess.run(command)\n+12     subprocess.run(command, shell=True)', 'Untrusted input may reach the shell. Review shell=True usage.') + diffFile('src/validators.py', ' 8 return value', ' 8 return validate(value)', '- 8 return value\n+ 8 return validate(value)') + '</div>', true)},
    {id:'analysis-new', group:'Analyses', title:'14 · New AI analysis', note:'Enter the GitHub PR number. Repeated analysis pre-fills that number. No PR list or related-files option.', html:shell(heading('New AI PR analysis') + box('Analysis parameters', field('Pull request number', '42') + field('Provider', 'Configured providers only') + field('Model', 'Models of the selected provider') + field('Additional instruction', 'Optional instructions for this analysis', 'text-placeholder') + actions('Start analysis', 'Cancel')), true)},
    {id:'analysis-log', group:'Analyses', title:'15 · AI analysis log', note:'Each event has data, existing branches and a restart instruction. No start, end or duration fields.', html:shell(heading('AI analysis log #104', 'PR #42', 'Open result') + '<div class="stack">' + runMetadata(false) + notice('For a branch: source analysis #98, event 02 · open original.') + notice('Conditional fork warning: MCP / Skills have changed; continuing may produce different results or fail.') + timeline(false) + '</div>', true)},
    {id:'rule-analysis', group:'Analyses', title:'17 · Rule-based analysis', note:'Read-only text output and run status. No rule-set snapshot.', html:shell(heading('Rule-based analysis #84', '', 'Back to project') + '<p>' + badge('Completed / Running / Failed') + '</p>' + code('Rule output · read-only', '[00:00] Analyzing github-user/python-api\n[rule-12] src/service.py:12 — unsafe shell=True\n[rule-08] src/config.py:24 — sample finding\n[00:08] Completed. Found 2 issues.') + conditional('run_failed', notice('Execution failed. Previously collected output is preserved.')), true)},
    {id:'generation-new', group:'Generation', title:'18 · Generate rule', note:'Description, provider, model and mode. No source field. Iterations only for Iterative / Multi-agent.', html:shell(heading('Generate a rule') + '<div class="columns">' + box('Problem description', field('Description / comment', 'Detect subprocess.run with shell=True for untrusted input', 'text-placeholder')) + box('Generation parameters', field('Provider', 'Configured providers only') + field('Model', 'Models of the selected provider') + field('Mode', 'Simple / Iterative / Multi-agent') + conditional('mode_requires_iterations', field('Iteration count', '3')) + '<p>A successful generation creates a new Draft rule.</p>' + actions('Generate', 'Cancel')) + '</div>', true)},
    {id:'generation-log', group:'Generation', title:'19 · Generation log', note:'Shared timeline layout with AI analysis logs. Final artifact: Python code and a Draft rule.', html:shell(heading('Rule generation log #104', 'Iterative · 3 iterations', 'Open created Draft') + '<div class="stack">' + runMetadata(true) + notice('For a branch: source generation #99, event 01 · open original.') + timeline(true) + '</div>', true)},
    {id:'rules', group:'Rules', title:'20 · Deterministic rules', note:'Status filter and pagination only. Status actions appear next to their respective rule.', html:shell(heading('Deterministic rules', '', 'Add rule', 'Generate rule') + field('Status filter', 'All / Draft / Disabled / Enabled') + actions('Apply filter') + '<hr class="separator"><div class="list">' + [
      ['Prevent shell=True', 'Draft', 'Approve'],
      ['Require timeout', 'Disabled', 'Enable'],
      ['Do not log secrets', 'Enabled', 'Disable']
    ].map(([name, status, action]) => '<div class="list-row"><strong>' + name + '</strong><div>' + badge(status) + '</div><div>' + actions('View') + conditional('is_quality_security_engineer', actions(action)) + '</div></div>').join('') + '</div>' + pagination() + conditional('no_results', notice('No rules match this status. Change the filter or add a rule.')), true)},
    {id:'rule', group:'Rules', title:'21 · Rule', note:'One template for create/read/edit. Existing rules are editable only if is_quality_security_engineer.', html:shell(heading('Rule #12 / New rule') + '<div class="stack">' + box('Rule details', field('Name', 'Prevent shell=True') + field('Description', 'Check unsafe subprocess calls', 'text-placeholder') + field('Author', 'developer@example.com') + field('Status', 'Draft on creation; status follows the allowed transitions') + conditional('has_source_generation', actions('Open generation log #104'))) + code('Rule code · textarea / read-only', 'def analyze(tree):\n    # One deterministic Python rule\n    findings = []\n    return findings') + conditional('is_new_rule or is_quality_security_engineer', actions('Save rule', 'Cancel')) + conditional('is_quality_security_engineer', actions('Draft → Disabled', 'Disabled ↔ Enabled')) + '</div>', true)},
    {id:'ai-settings', group:'AI settings', title:'22 · Project AI settings', note:'Visible if is_quality_security_engineer. Masked provider keys and large text editors.', html:shell(heading('Project AI settings') + '<div class="stack">' + box('Prompt and MCP', field('Additional system prompt', 'Sample Python code review instruction', 'text-placeholder') + code('MCP configuration · JSON textarea', '{\n  "mcpServers": {\n    "repository": { "command": "demo" }\n  }\n}') + actions('Save configuration')) + box('Provider keys', field('Provider A API key', '•••••••• · configured · enter a new key to replace') + field('Provider B API key', 'Not configured · enter a key') + actions('Save keys')) + box('Agent Skills', actions('Add skill') + '<hr class="separator">' + list([['Python quality', '', 'Enabled', ['Disable', 'Edit']], ['Security review', '', 'Disabled', ['Enable', 'Edit']]])) + '</div>', true)},
    {id:'skill-add', group:'AI settings', title:'23 · Add skill', note:'Text editor. Saving returns to AI settings.', html:shell(heading('Add Agent Skill') + field('Name', 'Python quality') + code('Skill text · textarea', '# Python quality\n\nSample instructions.\nWhat to check and how to report findings.') + actions('Add skill', 'Cancel · AI settings'), true)},
    {id:'skill-edit', group:'AI settings', title:'24 · Edit skill', note:'The same form as skill creation, pre-filled with the current text.', html:shell(heading('Edit Agent Skill', 'Skill #7') + field('Name', 'Python quality') + code('Current skill text · textarea', '# Python quality\n\nCurrent Python code review instructions.\nSample content for editing.') + actions('Save changes', 'Cancel · AI settings'), true)},
    {
      id:'usage', group:'Token usage', title:'25 · Token statistics',
      note:'Visible if is_quality_security_engineer. One selected model only; never combine models. User and period are optional. Grouping requires a period and replaces the summary with daily or monthly rows. The alternative states below are static previews.',
      html:shell(heading('Token usage') + '<div class="stack">' +
        box('Filters',
          field('Model', 'Select one configured model · required; no All models option') +
          field('User · optional', 'All users / selected user') +
          field('Period · optional', 'All time / from and to dates') +
          conditional('has_period', field('Group by', 'None / day / month')) +
          '<p class="help">Without user or period filters, show all-time usage for the selected model. A user filter limits usage to that user; a period further limits it to those dates.</p>' +
          actions('Apply filters', 'Clear optional filters')) +
        conditional('has_selected_model and not group_by',
          box('Usage summary · selected model', '<div class="cards">' +
            box('Total input', '<p>90,000 tokens</p>') +
            box('Total input cache read', '<p>25,000 tokens</p>') +
            box('Total input short-term cache write', '<p>8,000 tokens</p>') +
            box('Total input longer-term cache write', '<p>2,000 tokens</p>') +
            box('Total output', '<p>35,000 tokens</p>') +
          '</div>')) +
        conditional('has_selected_model and has_period and group_by',
          box('Usage by day / month · replaces summary',
            '<p class="help">Each row uses the same selected model, user and period filters.</p><div class="stack">' +
            ['October 18, 2026 / September 2026', 'October 19, 2026 / October 2026'].map(label =>
              box(label, '<div class="meta"><p>Total input: 4,000</p><p>Total input cache read: 1,000</p><p>Total input short-term cache write: 300</p><p>Total input longer-term cache write: 100</p><p>Total output: 1,500</p></div>')
            ).join('') + '</div>')) +
        conditional('not has_selected_model', notice('Select a model to view token usage.')) +
      '</div>', true)
    }
  ];
  const tabs = document.getElementById('tabs');
  const panels = document.getElementById('panels');
  let currentGroup = '';
  screens.forEach((screen, index) => {
    if (screen.group !== currentGroup) {
      const group = document.createElement('div');
      group.className = 'group-name';
      group.textContent = screen.group;
      tabs.append(group);
      currentGroup = screen.group;
    }
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'screen-tab';
    button.id = `tab-${screen.id}`;
    button.setAttribute('role', 'tab');
    button.setAttribute('aria-controls', `panel-${screen.id}`);
    button.setAttribute('aria-selected', String(index === 0));
    button.tabIndex = index === 0 ? 0 : -1;
    button.textContent = screen.title;
    button.addEventListener('click', () => selectScreen(index));
    button.addEventListener('keydown', event => {
      let next;
      if (event.key === 'ArrowDown') next = (index + 1) % screens.length;
      if (event.key === 'ArrowUp') next = (index - 1 + screens.length) % screens.length;
      if (event.key === 'Home') next = 0;
      if (event.key === 'End') next = screens.length - 1;
      if (next !== undefined) {
        event.preventDefault();
        selectScreen(next);
        document.getElementById(`tab-${screens[next].id}`).focus();
      }
    });
    tabs.append(button);
    const panel = document.createElement('section');
    panel.id = `panel-${screen.id}`;
    panel.className = 'screen-panel';
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', button.id);
    panel.hidden = index !== 0;
    panel.innerHTML = `<div class="screen-description"><h2>${screen.title}</h2><p>${screen.note}</p></div>${screen.html}`;
    panels.append(panel);
  });
  function selectScreen(index) {
    screens.forEach((screen, i) => {
      const selected = i === index;
      const tab = document.getElementById(`tab-${screen.id}`);
      tab.setAttribute('aria-selected', String(selected));
      tab.tabIndex = selected ? 0 : -1;
      document.getElementById(`panel-${screen.id}`).hidden = !selected;
    });
    document.getElementById('main').scrollTop = 0;
  }
</script>
</body>
</html>
